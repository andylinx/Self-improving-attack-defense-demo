<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" role="img" aria-label="Pixel skull">
  <rect width="16" height="16" fill="none"/>
  <!-- outline -->
  <g fill="#3d0606">
    <rect x="4" y="1" width="8" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
    <rect x="12" y="2" width="1" height="1"/>
    <rect x="2" y="3" width="1" height="6"/>
    <rect x="13" y="3" width="1" height="6"/>
    <rect x="3" y="9" width="1" height="1"/>
    <rect x="12" y="9" width="1" height="1"/>
    <rect x="4" y="10" width="1" height="1"/>
    <rect x="11" y="10" width="1" height="1"/>
    <rect x="4" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
    <rect x="5" y="15" width="6" height="1"/>
    <rect x="7" y="11" width="2" height="4"/>
  </g>
  <!-- bone -->
  <g fill="#ef4444">
    <rect x="4" y="2" width="8" height="1"/>
    <rect x="3" y="3" width="10" height="1"/>
    <rect x="3" y="4" width="10" height="1"/>
    <rect x="3" y="5" width="10" height="1"/>
    <rect x="3" y="6" width="10" height="1"/>
    <rect x="3" y="7" width="10" height="1"/>
    <rect x="3" y="8" width="10" height="1"/>
    <rect x="4" y="9" width="8" height="1"/>
    <rect x="5" y="10" width="6" height="1"/>
    <rect x="5" y="11" width="2" height="4"/>
    <rect x="9" y="11" width="2" height="4"/>
  </g>
  <!-- shading -->
  <g fill="#b91c1c">
    <rect x="3" y="8" width="10" height="1"/>
    <rect x="5" y="10" width="6" height="1"/>
  </g>
  <!-- eyes -->
  <g fill="#1a0202">
    <rect x="4" y="5" width="3" height="3"/>
    <rect x="9" y="5" width="3" height="3"/>
  </g>
  <!-- eye glow -->
  <g fill="#ff5c5c">
    <rect x="5" y="6" width="1" height="1"/>
    <rect x="10" y="6" width="1" height="1"/>
  </g>
  <!-- nose -->
  <rect x="7" y="8" width="2" height="1" fill="#1a0202"/>
  <!-- teeth gaps -->
  <g fill="#3d0606">
    <rect x="6" y="11" width="1" height="3"/>
    <rect x="9" y="11" width="1" height="3"/>
  </g>
</svg>
